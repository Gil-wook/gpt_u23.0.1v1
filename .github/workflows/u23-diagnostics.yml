          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/uLaunch-HOS23-boottrace.patch
          cd uLaunch-src
          git apply --check /tmp/uLaunch-HOS23-boottrace.patch
          git apply /tmp/uLaunch-HOS23-boottrace.patch
          echo "Diagnostic patch applied to $(git rev-parse --short HEAD)"

      - name: Build diagnostic binaries and package SD files
        shell: bash
        run: |
          set -euo pipefail
          cd uLaunch-src
          make -j2 LIBNX="$GITHUB_WORKSPACE/libnx/nx/" usystem uloader umenu umanager default-theme-music 2>&1 | tee uLaunch-diagnostic-build.log
          test -s SdOut/atmosphere/contents/0100000000001000/exefs.nsp
          test -s SdOut/ulaunch/bin/uMenu/main
          test -s SdOut/ulaunch/bin/uLoader/applet/main
          test -s SdOut/switch/uManager.nro
          cd SdOut
          zip -qr "$GITHUB_WORKSPACE/u23-diagnostics-test2.zip" atmosphere ulaunch switch
          unzip -t "$GITHUB_WORKSPACE/u23-diagnostics-test2.zip"
          sha256sum "$GITHUB_WORKSPACE/u23-diagnostics-test2.zip" | tee "$GITHUB_WORKSPACE/u23-diagnostics-test2.sha256"

      - name: Upload test ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: u23-diagnostics-test2
          path: |
            u23-diagnostics-test2.zip
            u23-diagnostics-test2.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: u23-diagnostics-build-log
          path: uLaunch-src/uLaunch-diagnostic-build.log
          if-no-files-found: ignore
          retention-days: 14