            cGFjZSB7CiAKICAgICAgICAgY2hhciBnX0xvZ1BhdGhbRlNfTUFYX1BBVEhdID0ge307CisgICAg
            ICAgIC8vIElmIC91bGF1bmNoIGlzIG1pc3Npbmcgb3IgdW53cml0YWJsZSwga2VlcCBib290IGRp
