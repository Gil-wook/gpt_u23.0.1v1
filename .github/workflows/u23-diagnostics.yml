name: Build uLaunch HOS 23.0.1 diagnostics

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/u23-diagnostics.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git patch autoconf automake diffutils pkgconf fakeroot file tar bzip2 zstd \
            python3 python3-requests python-is-python3 zip ca-certificates

      - name: Fetch uLaunch source and pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/XorTroll/uLaunch.git uLaunch-src
          cd uLaunch-src
          git checkout 6da94f9164f5fa61380010008270457f95ff4b04
          git submodule update --init --recursive
          git -C libs/Atmosphere-libs fetch origin cf48d23375cf36742876f4b014971b2ebabc6dc8
          git -C libs/Atmosphere-libs checkout --detach cf48d23375cf36742876f4b014971b2ebabc6dc8
          cd ..
          git clone https://github.com/switchbrew/libnx.git libnx
          git -C libnx checkout b156b4774fb2df7b93402169509266da7547fc4c
          make -C libnx -j2
          cp -r libnx/nx/external/bsd/include libnx/nx

      - name: Apply early boot logging patch
